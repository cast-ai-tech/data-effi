name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only values. Real deployments read these from their own secret store;
  # none of these open anything that exists outside this ephemeral job.
  POSTGRES_USER: norte
  POSTGRES_PASSWORD: ci-postgres-password-not-a-secret
  POSTGRES_DB: norte
  POSTGRES_APP_PASSWORD: ci-app-password-not-a-secret
  POSTGRES_READONLY_PASSWORD: ci-readonly-password-not-a-secret
  JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
  PII_HASH_SALT: ci-pii-salt-0123456789abcdef0123456789abcdef
  WORKER_TRIGGER_SECRET: ci-worker-secret-0123456789abcdef0123456789

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norte
          POSTGRES_PASSWORD: ci-postgres-password-not-a-secret
          POSTGRES_DB: norte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy api pipeline worker ai --ignore-missing-imports
        continue-on-error: true

      - name: Apply migrations
        env:
          POSTGRES_ADMIN_URL: postgresql://norte:ci-postgres-password-not-a-secret@localhost:5432/norte
        run: python -m scripts.migrate

      - name: Set up database roles
        env:
          POSTGRES_ADMIN_URL: postgresql://norte:ci-postgres-password-not-a-secret@localhost:5432/norte
        run: python -m scripts.setup_roles

      - name: Tests
        env:
          POSTGRES_ADMIN_URL: postgresql://norte:ci-postgres-password-not-a-secret@localhost:5432/norte
          DATABASE_URL: postgresql://norte_app:ci-app-password-not-a-secret@localhost:5432/norte
        run: pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npx eslint .

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t dataeffi-api:ci .

      - name: Build web image
        run: docker build -f web/Dockerfile -t dataeffi-web:ci ./web
