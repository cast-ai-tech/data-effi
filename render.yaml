# Render Blueprint — Master Data API (plan Starter).
#
# EL PLAN IMPORTA, Y POR ESO SE DECLARA AQUI. El servicio es blueprint-managed:
# si este archivo dice `free`, una resincronizacion puede devolver el servicio a
# ese plan y con el vuelven sus dos problemas - el servicio duerme a los 15
# minutos y no hay disco. Starter no duerme y permite el disco de abajo.
#
# El worker NO va como servicio aparte: WORKER_ENABLED=false y un cron externo
# (cron-job.org) llama POST /worker/trigger/{job} con la cabecera
# X-Worker-Secret. Eso corre los jobs programados.
#
# MAX_UPLOAD_MB va en 25: el upload lee por trozos y corta al pasar el limite,
# asi que un archivo nunca ocupa mas que su propio tamano en RAM.
#
# Los archivos llegan DIRECTO del navegador a este servicio (no por el proxy de
# la web, que corre como funcion serverless y corta el cuerpo: 4,5 MB en Vercel,
# 6 MB en Netlify). Por eso CORS tiene que dejar pasar a la web:
#   - CORS_ORIGINS (dashboard): la URL de produccion en Vercel y, mientras siga
#     de respaldo, la de Netlify. Separadas por coma, sin barra final.
#   - CORS_ORIGIN_REGEX (aqui): la produccion y los previews de Vercel del
#     proyecto masterdataweb, que cambian de URL en cada rama.

services:
  - type: web
    name: master-data-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    region: virginia          # misma costa que Supabase us-east-1
    healthCheckPath: /health
    autoDeploy: false
    # Los archivos subidos viven aqui hasta que la ingesta termina con ellos.
    #
    # POR QUE UN DISCO Y NO /tmp. En el plan free no habia disco, asi que
    # UPLOAD_DIR apuntaba a /tmp: cada reinicio - y el free dormia el servicio a
    # los 15 minutos - se llevaba el archivo a medio procesar, y el trabajo
    # quedaba en cola apuntando a algo que ya no existia. Paso de verdad el
    # 2026-08-27 con un reporte de 1,85 MB. Un disco montado sobrevive a
    # reinicios y despliegues, asi que una carga interrumpida se retoma en vez
    # de perderse.
    #
    # 1 GB es holgado: MAX_UPLOAD_MB=25 y los archivos se borran al ingerirse;
    # lo ya cargado vive en Postgres, no aqui.
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      # --- se cargan a mano en el dashboard, nunca en el repo ---
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_READONLY
        sync: false
      # La ingesta va por el SESSION pooler de Supabase (puerto 5432): la misma
      # cadena que DATABASE_URL pero con :6543 -> :5432. Una carga es una
      # transaccion larga que el transaction pooler (6543) corta a los 2min. Si
      # queda vacia, la ingesta usa DATABASE_URL y los archivos grandes fallan.
      - key: DATABASE_URL_INGEST
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PII_HASH_SALT
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      # Migration 051. Encrypts each merchant's platform password. Without it
      # the connection screen says so and everyone uploads by hand instead.
      - key: CONNECTION_VAULT_KEY
        sync: false
      # La forma del login de Effi. Van aqui, y no en el codigo, porque es la
      # parte con mas probabilidad de cambiar del lado de Effi: cuando cambie,
      # se ajusta en el dashboard y se reinicia, sin tocar el repo ni esperar
      # un build. Vacias mientras el contrato siga sin verificarse contra una
      # cuenta real - connectors/effi/auth.py se niega a entrar hasta entonces,
      # asi que dejarlas en blanco es el estado correcto, no un olvido.
      - key: EFFI_BASE_URL
        sync: false
      - key: EFFI_LOGIN_PATH
        sync: false
      - key: EFFI_LOGIN_USER_FIELD
        sync: false
      - key: EFFI_LOGIN_PASS_FIELD
        sync: false
      - key: EFFI_LOGIN_CSRF_FIELD
        sync: false
      - key: EFFI_SESSION_CARRIER
        sync: false
      - key: EFFI_SESSION_COOKIE
        sync: false
      - key: EFFI_TOKEN_JSON_KEY
        sync: false
      - key: WORKER_TRIGGER_SECRET
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # OJO: este patron acepta cualquier proyecto de Vercel cuyo nombre empiece
      # por masterdataweb-. Cualquiera puede crear uno. La API no usa cookies
      # (solo bearer), asi que un origen ajeno no hereda ninguna sesion, pero lo
      # correcto es anclarlo al slug del equipo, que Vercel pone al final de
      # cada preview. Cuando se confirme el slug (<team> abajo), reemplazar por:
      #   '^https://masterdataweb(-git-[a-z0-9-]+|-[a-z0-9]+)-<team>\.vercel\.app$'
      # y dejar la URL de produccion solo en CORS_ORIGINS.
      - key: CORS_ORIGIN_REGEX
        value: '^https://masterdataweb(-[a-z0-9-]+)?\.vercel\.app$'
      - key: PROXY_SHARED_SECRET
        sync: false
      # Número de WhatsApp del asesor comercial (planes a la medida y cobro
      # manual). Con indicativo, solo dígitos: 573001234567. Vacío = el botón
      # de contacto no aparece.
      - key: ADVISOR_WHATSAPP
        sync: false

      # --- valores fijos del despliegue gratuito ---
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "8000"
      - key: LOG_LEVEL
        value: INFO
      - key: WORKER_ENABLED
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: INGEST_MAX_CONCURRENCY
        value: "2"
      # El disco montado arriba, no /tmp: un archivo a medio procesar tiene que
      # seguir ahi despues de un reinicio.
      - key: UPLOAD_DIR
        value: /app/uploads
      # Se activan desde el panel, no aqui: un valor fijo en el Blueprint pisa
      # lo que se escriba en el dashboard en cada deploy.
      - key: AI_ENABLED
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: TIER3_FETCH_ENABLED
        value: "false"
      - key: FX_PROVIDER_URL
        value: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies
