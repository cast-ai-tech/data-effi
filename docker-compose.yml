# Data Effi - the whole platform.
#
#   docker compose up          -> database, migrations, API, worker, web
#   make seed-demo             -> a three-country demo workspace with real numbers
#
# Every value comes from .env. Copy .env.example first and fill the blanks; the
# API refuses to start with a placeholder secret rather than starting insecure.

x-app-env: &app-env
  DATABASE_URL: postgresql://norte_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@db:5432/${POSTGRES_DB:-norte}
  DATABASE_URL_READONLY: postgresql://norte_readonly:${POSTGRES_READONLY_PASSWORD:-}@db:5432/${POSTGRES_DB:-norte}
  POSTGRES_ADMIN_URL: postgresql://${POSTGRES_USER:-norte}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-norte}
  POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
  POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  PII_HASH_SALT: ${PII_HASH_SALT:?PII_HASH_SALT is required}
  # Reversible encryption for the contact details the orders table renders.
  # Distinct from PII_HASH_SALT: the salt makes identity irreversible for
  # grouping, this key makes name and phone readable again for the operator.
  # Not marked required - without it the platform runs and simply reports
  # pii_visible=false, which is the correct behaviour for a deployment that
  # chose not to store contact data at all.
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
  WORKER_TRIGGER_SECRET: ${WORKER_TRIGGER_SECRET:?WORKER_TRIGGER_SECRET is required}
  PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # The origin outside callers (n8n, Make, Zapier) use to reach the API.
  # Empty falls back to the request host, which behind a proxy is internal.
  PUBLIC_API_URL: ${PUBLIC_API_URL:-}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  INGEST_MAX_CONCURRENCY: ${INGEST_MAX_CONCURRENCY:-4}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  AI_ENABLED: ${AI_ENABLED:-false}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gemini-3.6-flash}
  AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-200000}
  TIER3_FETCH_ENABLED: ${TIER3_FETCH_ENABLED:-false}
  FX_PROVIDER_URL: ${FX_PROVIDER_URL:-https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies}
  FX_PROVIDER_API_KEY: ${FX_PROVIDER_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    container_name: dataeffi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-norte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-norte}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dataeffi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Applies migrations and sets the role passwords, then exits. Everything else
  # waits for it to finish, so the API never meets a half-built schema.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dataeffi_migrate
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python -m scripts.migrate &&
        python -m scripts.setup_roles
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dataeffi_api
    environment:
      <<: *app-env
      UPLOAD_DIR: /app/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - dataeffi_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dataeffi_worker
    environment:
      <<: *app-env
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    command: ["python", "-m", "worker.main"]
    # The worker shares the API image but serves no HTTP, so the inherited
    # curl healthcheck would always fail. Check that the scheduler is alive.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'worker.main' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: dataeffi_web
    environment:
      # Docker overwrites HOSTNAME with the container id, and Next's standalone
      # server binds to whatever HOSTNAME says - so it ends up listening on a
      # name nothing else resolves. Setting it here wins over that default.
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # Server-side: the web container reaches the API over the compose network.
      API_URL: http://api:8000
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  dataeffi_pgdata:
  dataeffi_uploads:
